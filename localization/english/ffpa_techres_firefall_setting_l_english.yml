l_english:
 international_organizations:0 "Survivor Accord System"
 international_organizations_desc:0 "Scattered enclaves and successor governments can no longer rely on the old world's institutions to settle their disputes. Permanent delegations and negotiated accords give them a common language for recognition, mediation, and collective action. Cooperation extends their diplomatic reach, while shared rules make expansion harder to justify to their neighbours."
 decolonization:0 "Recognition of Successor States"
 decolonization_desc:0 "An old flag is no longer enough to establish authority over the people living beneath it. City councils, settlement assemblies, and successor governments press competing claims to sovereignty. A framework for recognising these claims gives the new states international standing and lends weight to demands for self-government against would-be restorers of empire."
 neoimperialism:0 "Reconstruction Hegemony"
 neoimperialism_desc:0 "States able to offer protection, aid, and administrative expertise gain influence over neighbours still struggling to survive. Shared policing arrangements reduce the cost of maintaining order, while garrisons and dependent administrations extend the patron's reach. Each assertion of power also deepens suspicion that reconstruction is becoming another name for empire."
 penicillin:0 "Penicillin"
 penicillin_desc:0 "Restoring reliable supplies of penicillin makes wounds and infections treatable again. Maternity clinics can prevent infections around childbirth, while families gain the confidence to raise children in settlements where essential care is returning."
 socialdemocracy:0 "Social Democracy"
 socialdemocracy_desc:0 "Reconstruction depends on people as much as machinery. Childcare, family support, and shared public services help parents raise children while taking part in paid work. Social guarantees give surviving households a stake in the new order and make rebuilding a common undertaking."
 vaccination_campaigns:0 "Vaccination Campaigns"
 vaccination_campaigns_desc:0 "Displacement and the collapse of routine care have left entire communities vulnerable to preventable disease. Restored vaccine supplies, mobile clinics, and local health workers rebuild collective protection, reducing deaths and the disruption caused by outbreaks."
 genetic_disease_screening:0 "Genetic Disease Screening"
 genetic_disease_screening_desc:0 "Voluntary screening, confidential counselling, and early treatment help families manage inherited conditions amid the loss of medical records and specialist care. Better prenatal support makes parenthood safer without making access to care conditional on ancestry or test results."
 neo_feminism:0 "Neo-Feminism"
 neo_feminism_desc:0 "A society short of people cannot afford barriers that exclude women from public life and employment. Equal access to training and work, shared parenting, and dependable childcare allow more adults to contribute to reconstruction while supporting those who choose to have children."
 genetic_engineering:0 "Genetic Engineering"
 genetic_engineering_desc:0 "Rebuilt laboratories recover techniques for treating inherited disease and restoring reproductive health. Voluntary therapies and clinical oversight turn part of the old world's knowledge into longer, healthier lives and new possibilities for families rebuilding their future."
 transnational_activism:0 "Cross-Border Solidarity Networks"
 transnational_activism_desc:0 "The fire erased many borders without erasing the need for cooperation. Radio relays, caravan couriers, and recovering data links let unions, scholars, and local associations exchange warnings, coordinate relief, and restrain new powers across the scattered settlements."
 global_stock_market:0 "Interregional Clearing Network"
 global_stock_market_desc:0 "The old exchanges and their instant global markets are gone. Standard ledgers, trusted clearing houses, radio quotations, and guarded courier routes now reconnect surviving markets well enough for capital to cross regional frontiers again."
 globalization:0 "Postwar Reconnection"
 globalization_desc:0 "This is not a return to the effortless global economy of the old world. Reopened ports, repaired rail corridors, common commercial standards, and long-distance relay networks gradually bind isolated markets into a fragile new system of exchange."
 social_media:0 "Mesh Public Sphere"
 social_media_desc:0 "The centralized platforms of the old world did not survive intact. Local servers, radio-linked message boards, and improvised mesh networks let distant communities speak to one another again, expanding their reach while weakening any government's monopoly over information."
 app_economy:0 "Distributed Service Platforms"
 app_economy_desc:0 "Recovered software stacks and rebuilt payment links allow merchants, offices, and freight operators to coordinate through distributed service platforms. The most successful operators grow into a new generation of companies adapted to unreliable infrastructure."
