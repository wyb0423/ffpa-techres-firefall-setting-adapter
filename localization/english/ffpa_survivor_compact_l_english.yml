 ffpa_sc.1.t: "Contacts Between Survivors"
 ffpa_sc.1.d: "#header Invitation to Cooperate#!\nJoining establishes regular knowledge exchange. Each specific protocol remains a national choice.\n\n#header Membership Growth#!\nBelow 2 / at 2 / at 6 active years:\nTechnology spread #P +5% / +10% / +15%#!\nInnovation output #P +2% / +4% / +6%#!\nInfluence #N −5% / −10% / −10%#!\n\n#header Activation#!\nBenefits and progress require two eligible members. No innovation cap increase, law changes or automatic protocol enrolment."
 ffpa_sc.2.t: "Compact Assembly Opens"
 ffpa_sc.2.d: "Session Open\nA new proposal enters a full 3-month vote.\n\nOur Action\nOpen the Survivors Compact overview for the current subject and tally. Vote for, against or abstain.\n\nSupporting access to cooperation does not enrol our country."
 ffpa_sc.3.t: "Compact Vote Concluded"
 ffpa_sc.3.d: "Vote Settlement\nResult: [GetPlayer.GetCustom('ffpa_sc_vote_result')]\nThe assembly enters 9 months of recess.\n\nWhat Follows\nPassed aid proposals with valid supply open 1 month of registration within this recess. Other passed protocols open for voluntary participation.\n\nCheck the overview for actual availability. Passage never creates a task for us automatically."
 ffpa_sc.4.t: "Preparation Period Ended"
 ffpa_sc.4.d: "#header Preparation Incomplete#!\n#N The original deadline has passed#!; this commitment ends.\n\n#header Retry#!\nTry again #V 3 years#! after the original deadline.\n\n#header Retained Progress#!\nDomestic laws and institutions remain unchanged. No infamy is added."
 ffpa_sc.5.t: "Survivors Compact: Save Migration"
 ffpa_sc.5.d: "#header Organization Adapted#!\nEligible former members retain ordinary membership. Old institutions unlock optional cooperation; old ballots and institutional effects have been cleared.\n\n#header Choices to Make#!\nChoose protocols in the Compact overview and volunteer for coordination if desired.\n\n#header Existing State Preserved#!\nDomestic laws, territory, buildings and nuclear treaties are not rolled back."
 ffpa_sc_result_pass: "Passed"
 ffpa_sc_result_fail: "Failed"
 ffpa_sc.1.f: "Envoys bring a proposal for reconstruction: members can exchange knowledge, improve trade, and undertake public works. Joining establishes contact; participation in each protocol remains a national choice."
 ffpa_sc.2.f: "Delegates are considering a new channel of cooperation. Supporting its availability does not commit our country to participating."
 ffpa_sc.3.f: "The delegates have concluded this session. Each country can review the available protocols and weigh their benefits against their costs."
 ffpa_sc.4.f: "The original preparation deadline has passed. The Compact does not legislate for us; we can make a new commitment when the retry period ends."
 ffpa_sc.5.f: "The former organization now supports voluntary reconstruction cooperation. Members must choose their projects anew, while existing domestic institutions and investments remain in place."
