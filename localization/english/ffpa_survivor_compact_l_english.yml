l_english:
 ffpa_sc_found_decision: "Found the Survivors Compact"
 ffpa_sc_found_decision_desc: "Create a voluntary cooperation forum and accept coordinating duties. Cooperation and voting activate after two countries join. No laws are changed automatically."
 ffpa_sc_join_decision: "Join the Survivors Compact"
 ffpa_sc_join_decision_desc: "Cooperation matures at 24 and 72 active months: technology spread +5%/+10%/+15%, innovation output +2%/+4%/+6%, influence -5%/-10%/-10%. No innovation cap increase. Benefits, costs and progress require at least two members. Protocols remain opt-in; vote from the following session."
 ffpa_sc_leave_decision: "Leave the Survivors Compact"
 ffpa_sc_leave_decision_desc: "Leave the organization and its protocols, ending their benefits and extra costs. No infamy or reversal of laws/buildings. Membership progress resets; rejoining starts at the first stage. Original preparation deadlines and project cooldowns remain in force."
 ffpa_sc_volunteer_decision: "Volunteer for Coordination"
 ffpa_sc_volunteer_decision_desc: "Volunteer for up to three prestige-selected coordinator seats and proposal rights. Pay an additional -5% influence; research benefits and cooperation progress match ordinary members. No extra votes or veto."
 ffpa_sc_resign_decision: "Withdraw from Coordination"
 ffpa_sc_resign_decision_desc: "Withdraw your candidacy and any current seat, retaining ordinary membership."
 ztr_onu_member: "Compact Member"
 ztr_onu_permanent_member: "Compact Coordinator"
 ffpa_sc_education_modifier: "Education and Technical Exchange"
 ffpa_sc_trade_modifier: "Trade and Customs Cooperation"
 ffpa_sc_works_modifier: "Three-Year Public Works"
 ffpa_sc_education_modifier_desc: "#header Benefits#!\nTechnology spread #P +25%#!\nEducation access #P +5 percentage points#!\nQualifications #P +25%#!\n\n#header Maintenance Costs#!\nSchools institution bureaucracy cost #N +25%#!\nGovernment wages #N +10%#!\n\n#lore Education access is not an immediate increase in literacy.#!"
 ffpa_sc_trade_modifier_desc: "#header Benefits#!\nImport and export advantage #P +25%#! each\nTrade capacity #P +20%#!\n\n#header Maintenance Costs#!\nMaximum import and export tariffs #N −10 percentage points#! each\nBureaucracy output #N −5%#!\n\n#lore Applies to our foreign trade generally, not only trade with members.#!"
 ffpa_sc_works_modifier_desc: "#header Construction Benefits#!\nState construction efficiency #P +20%#!\nDevastation recovery #P +25%#!\n\n#header Maintenance Costs#!\nConstruction goods cost #N +10%#!\nBureaucracy output #N −5%#!\n\n#header Duration and Limits#!\nLasts #V 3 years#!; shares a #V 5-year#! start interval with aid.\n#b Does not clear radiation#!."
 ztr_onu_member_desc: "Diplomatic commitments sustain shared knowledge while cooperation is operational."
 ztr_onu_permanent_member_desc: "Additional diplomatic commitments grant proposal rights; each country still has one vote."
 ffpa_sc_propose_education: "Propose: Open Education Protocol"
 ffpa_sc_propose_education_desc: "#header Assembly Procedure#!\nVoting opens at the next monthly agenda for #V 3 months#!, followed by #V 9 months#! of recess.\n\n#header On Passage#!\nOpens this cooperation for countries to #b opt in#!. No preparation task is created automatically."
 ffpa_sc_propose_trade: "Propose: Open Trade Protocol"
 ffpa_sc_propose_trade_desc: "#header Assembly Procedure#!\nVoting opens at the next monthly agenda for #V 3 months#!, followed by #V 9 months#! of recess.\n\n#header On Passage#!\nOpens this cooperation for countries to #b opt in#!. No preparation task is created automatically."
 ffpa_sc_propose_works: "Propose: Open Works Cooperation"
 ffpa_sc_propose_works_desc: "#header Assembly Procedure#!\nVoting opens at the next monthly agenda for #V 3 months#!, followed by #V 9 months#! of recess.\n\n#header On Passage#!\nOpens this cooperation for countries to #b opt in#!. No preparation task is created automatically."
 ffpa_sc_vote_support: "Vote For"
 ffpa_sc_vote_support_desc: "#header Voting Rules#!\n#V One vote#! per country; it may be changed during the session.\n\n#header Passage Requires#!\nMore votes for than against.\nSupport from at least #V one third#! of eligible members and at least #V 2 countries#!.\n\n#lore Abstention is not opposition. Coordinators have no extra vote or veto.#!"
 ffpa_sc_vote_against: "Vote Against"
 ffpa_sc_vote_against_desc: "#header Voting Rules#!\n#V One vote#! per country; it may be changed during the session.\n\n#header Passage Requires#!\nMore votes for than against.\nSupport from at least #V one third#! of eligible members and at least #V 2 countries#!.\n\n#lore Abstention is not opposition. Coordinators have no extra vote or veto.#!"
 ffpa_sc_vote_abstain: "Abstain"
 ffpa_sc_vote_abstain_desc: "#header Voting Rules#!\n#V One vote#! per country; it may be changed during the session.\n\n#header Passage Requires#!\nMore votes for than against.\nSupport from at least #V one third#! of eligible members and at least #V 2 countries#!.\n\n#lore Abstention is not opposition. Coordinators have no extra vote or veto.#!"
 ffpa_sc_join_education: "Opt In: Education Cooperation"
 ffpa_sc_join_education_desc: "$ffpa_sc_education_modifier_desc$\n\n#header Participation#!\nBenefits begin immediately if qualified. Otherwise prepare for up to #V 5 years#!, using the single active slot.\nPreparation grants no protocol benefits or extra costs. On failure, retry #V 3 years#! after the original deadline."
 ffpa_sc_leave_education: "Leave Education Cooperation"
 ffpa_sc_leave_education_desc: "#header On Withdrawal#!\nEnd this protocol’s #b benefits and extra costs#!. Retain membership, domestic laws and institutions.\n\n#header Still in Force#!\nUnfinished preparation deadlines and existing retry restrictions."
 ffpa_sc_join_trade: "Opt In: Trade Cooperation"
 ffpa_sc_join_trade_desc: "$ffpa_sc_trade_modifier_desc$\n\n#header Participation#!\nBenefits begin immediately if qualified. Otherwise prepare for up to #V 5 years#!, using the single active slot.\nPreparation grants no protocol benefits or extra costs. On failure, retry #V 3 years#! after the original deadline."
 ffpa_sc_leave_trade: "Leave Trade Cooperation"
 ffpa_sc_leave_trade_desc: "#header On Withdrawal#!\nEnd this protocol’s #b benefits and extra costs#!. Retain membership, domestic laws and institutions.\n\n#header Still in Force#!\nUnfinished preparation deadlines and existing retry restrictions."
 ffpa_sc_start_works: "Start Three-Year Public Works"
 ffpa_sc_start_works_desc: "$ffpa_sc_works_modifier_desc$\n\n#header Starting Requirements#!\nConstruction must be in progress. Uses the single active-task slot."
 ffpa_sc_reform: "Advance Compliance Reform"
 ffpa_sc_reform_desc: "#header This Action#!\nStart normal enactment of an available missing law with over #V 10%#! enactment chance.\n\n#header Requirements and Limits#!\nNo other law may be in enactment. At least #V 6 months#! between attempts.\n#b Passage is not forced#!. School institutions still require normal investment."
 ffpa_sc_stop_task: "Abandon Current Task"
 ffpa_sc_stop_task_desc: "#header On Abandonment#!\nRelease the active slot and stop this task’s effects. No fine or refund.\n\n#header Still in Force#!\nOriginal preparation deadlines, retry restrictions, and the works/aid start cooldown."
 ffpa_sc_overview: "Survivors Compact"
 ffpa_sc_overview_reason: "Envoys, teachers and engineers bring their countries’ reconstruction experience to the same table. The Compact opens channels of cooperation; #b each commitment remains a national choice#!.\n\n#header Long-term Protocols#!\nEducation: [GetPlayer.GetCustom('ffpa_sc_education_status')]\nTrade: [GetPlayer.GetCustom('ffpa_sc_trade_status')]\n\n#header Timed Projects#!\nPublic works: [GetPlayer.GetCustom('ffpa_sc_works_status')]\n\n#header Aid Plans#!\nEducation outreach: [GetPlayer.GetCustom('ffpa_sc_aid_education_status')]\nSkills training: [GetPlayer.GetCustom('ffpa_sc_aid_talent_status')]\nProduction research: [GetPlayer.GetCustom('ffpa_sc_aid_production_status')]\nSociety research: [GetPlayer.GetCustom('ffpa_sc_aid_society_status')]\nMilitary research: [GetPlayer.GetCustom('ffpa_sc_aid_military_status')]\n\n#header Our Aid Finances · Weekly#!\nService revenue: #V £[GetPlayer.MakeScope.ScriptValue('ffpa_sc_aid_my_income')|2]#!\n[GetPlayer.GetCustom('ffpa_sc_aid_payment')]\n\n#lore Participation buttons explain each protocol’s benefits and costs. Unselected cooperation creates no timed task.#!"
 ffpa_sc_overview_goal: "Open cooperation through the assembly, then choose what our country can sustain."
 ffpa_sc_status_dormant: "#header Assembly · Awaiting Members#!\nAt least #V 2#! eligible members are required.\n#yellow Cooperation benefits and maintenance costs are suspended#!."
 ffpa_sc_status_pending: "#header Assembly · Proposal Submitted#!\nThree months of voting begin at the #b next monthly agenda#!."
 ffpa_sc_status_cooldown: "#header Assembly · Recess#!\n#V [GetGlobalVariable('ffpa_sc_cooldown').GetValue|0]#! months remaining.\nOpen protocols remain available to join."
 ffpa_sc_status_ready: "#header Assembly · Ready for Proposals#!\nCoordinators may propose the next cooperation initiative."
 ffpa_sc_status_voting: "#header Assembly · Voting#!\nSubject: #b [GetPlayer.GetCustom('ffpa_sc_vote_subject')]#!\n#V [GetGlobalVariable('ffpa_sc_months_left').GetValue|0]#! months remaining\n\nFor #V [GetGlobalVariable('ffpa_sc_support').GetValue|0]#! / Against #V [GetGlobalVariable('ffpa_sc_against').GetValue|0]#!\nEligible members: #V [GetGlobalVariable('ffpa_sc_electorate').GetValue|0]#!\nOur position: #b [GetPlayer.GetCustom('ffpa_sc_my_vote')]#!"
 ffpa_sc_task_journal: "Compact: Active Task"
 ffpa_sc_task_journal_reason: "[GetPlayer.GetCustom('ffpa_sc_task_brief')]\n\n[GetPlayer.GetCustom('ffpa_sc_task_details')]\n\n#lore Preparation, works and aid registration share one active slot. Withdrawal preserves original deadlines and existing cooldowns.#!"
 ffpa_sc_task_journal_goal: "Complete preparation or sustain the current project. Review its requirements and finances in the task details."
