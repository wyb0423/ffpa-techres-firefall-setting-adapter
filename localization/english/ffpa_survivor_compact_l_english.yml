 ffpa_sc_aid_task_payment: "#header Our Fees#!\n[GetPlayer.GetCustom('ffpa_sc_aid_payment')]\nFull weekly quote fixed at registration: #V £[GetPlayer.MakeScope.Var('ffpa_sc_aid_quote').GetValue|2]#!\n[GetPlayer.GetCustom('ffpa_sc_aid_commitment')]\n\n#header Duration and Withdrawal#!\nRegistration is free. Execution lasts #V 3 years#! and shares the #V 5-year#! start interval with works.\nWar with a provider, default or withdrawal ends participation. Existing cooldowns remain in force.\n\n#lore The weekly pool above totals all recipients’ fees; it is not our bill.#!"
