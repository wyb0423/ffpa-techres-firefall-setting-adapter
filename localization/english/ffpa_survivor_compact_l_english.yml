 ffpa_sc.6.t: "Aid Plan: Annual Budget Review"
 ffpa_sc.6.d: "#header Annual Budget Review#!\nOne year of this aid round has passed. Confirm the commitment we can sustain.\n\n#header Available Choices#!\n#b Maintain#!: continue current services and fees.\n#b Reduce#!: halve subsequent fees and benefits.\n#b Withdraw#!: end participation and its associated finances.\n\n#header Deadlines Remain#!\nThe original deadline and #V 5-year#! start interval remain in force.\n\n[GetPlayer.GetCustom('ffpa_sc_aid_alternative_offer')]\nAlternative full-service baseline, scaled by supply. Fees stay unchanged. Choose an alternative, maintain, or reduce once; no further switching this round."
 ffpa_sc.6.f: "Compact specialists have presented their service arrangements for the next stage. Members must confirm the commitment they can sustain."
 ffpa_sc_aid_keep: "Maintain the Commitment"
 ffpa_sc_aid_cancel: "Withdraw from This Round"
 ffpa_sc_membership_1_modifier: "Compact Member: Establishing Contacts"
 ffpa_sc_membership_1_modifier_desc: "Active cooperation accumulates monthly, capped at 72 months. Upgrade at 24 and 72 months. Stages do not stack or increase the innovation cap. Fewer than two members pauses progress, benefits and costs. Leaving resets progress."
 ffpa_sc_membership_2_modifier: "Compact Member: Regular Exchange"
 ffpa_sc_membership_2_modifier_desc: "Active cooperation accumulates monthly, capped at 72 months. Upgrade at 24 and 72 months. Stages do not stack or increase the innovation cap. Fewer than two members pauses progress, benefits and costs. Leaving resets progress."
 ffpa_sc_membership_3_modifier: "Compact Member: Mature Network"
 ffpa_sc_membership_3_modifier_desc: "Active cooperation accumulates monthly, capped at 72 months. Upgrade at 24 and 72 months. Stages do not stack or increase the innovation cap. Fewer than two members pauses progress, benefits and costs. Leaving resets progress."
 ffpa_sc_coordinator_modifier: "Compact Coordination Duties"
 ffpa_sc_coordinator_modifier_desc: "An additional -5% influence for coordination, with no extra research benefit. Changing roles preserves cooperation progress."
 ffpa_sc_task_education_brief: "#header Education · Preparation#!\nTeachers and local officials are preparing for sustained exchange. Child-labor protections and a school institution must be in place before protocol benefits begin."
 ffpa_sc_task_trade_brief: "#header Trade · Preparation#!\nCustoms cooperation requires domestic laws that permit foreign trade. The choice of trade system remains ours; #b free trade is not mandatory#!."
 ffpa_sc_task_works_brief: "#header Public Works · Construction Cooperation#!\nEngineers share practical experience to improve construction. Our country also bears additional construction and administrative costs."
 ffpa_sc_task_aid_brief: "#header Aid Task · Service Cooperation#!\nRegistration reserves a place. Services and charges begin only when the plan launches; supply then scales fees and benefits together."
 ffpa_sc_task_unknown_brief: "#header Compact Task#!\nTask details are unavailable; wait for the next update."
 ffpa_sc_requirement_met: "#P Met#!"
 ffpa_sc_requirement_missing: "#yellow Not met#!"
 ffpa_sc_task_reform_hint: "Use #b Advance Compliance Reform#! or select the required law yourself. School institutions require separate investment."
 ffpa_sc_task_trade_reform_hint: "Use #b Advance Compliance Reform#! or select a law that permits foreign trade yourself."
 ffpa_sc_task_dormant_hint: "#yellow The Compact is not operational#!. At least two eligible members are needed for protocol benefits and the Compact reform button."
