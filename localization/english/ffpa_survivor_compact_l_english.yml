 ffpa_sc.1.t: "Contacts Between Survivors"
 ffpa_sc.1.d: "A voluntary forum is open to members. Ordinary membership exchanges −10% influence for +10% technology spread, active with at least two members. Joining changes no laws and enrolls in no protocols."
 ffpa_sc.2.t: "Compact Assembly Opens"
 ffpa_sc.2.d: "A proposal is open for three full months. View its subject and tally in the Survivors Compact overview and vote for, against or abstain."
 ffpa_sc.3.t: "Compact Vote Concluded"
 ffpa_sc.3.d: "Result: [GetPlayer.GetCustom('ffpa_sc_vote_result')]. Nine months of assembly recess follow. Passed aid plans open one month of registration; other protocols remain opt-in and create no automatic tasks."
 ffpa_sc.4.t: "Preparation Period Ended"
 ffpa_sc.4.d: "Preparation was not completed by the deadline. This commitment has ended. The three-year retry interval runs from the original deadline. Domestic laws and institutions remain unchanged; no infamy is added."
 ffpa_sc.5.t: "Survivors Compact: Save Migration"
 ffpa_sc.5.d: "The old UN has been migrated. Eligible members retain ordinary membership and existing institutions unlock optional protocols. Old ballots and institutional effects are cleared. Choose protocols and coordinating duties yourself. Existing domestic laws, territory, buildings and nuclear treaties are not rolled back."
 ffpa_sc_result_pass: "Passed"
 ffpa_sc_result_fail: "Failed"
 ffpa_sc.1.f: "Envoys bring a proposal for reconstruction: members can exchange knowledge, improve trade, and undertake public works. Joining establishes contact; participation in each protocol remains a national choice."
 ffpa_sc.2.f: "Delegates are considering a new channel of cooperation. Supporting its availability does not commit our country to participating."
 ffpa_sc.3.f: "The delegates have concluded this session. Each country can review the available protocols and weigh their benefits against their costs."
 ffpa_sc.4.f: "The original preparation deadline has passed. The Compact does not legislate for us; we can make a new commitment when the retry period ends."
 ffpa_sc.5.f: "The former organization now supports voluntary reconstruction cooperation. Members must choose their projects anew, while existing domestic institutions and investments remain in place."
