l_english:
 ffpa_sc_found_decision: "Found the Survivors Compact"
 ffpa_sc_found_decision_desc: "Create a voluntary cooperation forum and accept coordinating duties. Cooperation and voting activate after two countries join. No laws are changed automatically."
 ffpa_sc_join_decision: "Join the Survivors Compact"
 ffpa_sc_join_decision_desc: "Ordinary membership: +10% technology spread, −10% influence. Protocols are opt-in; joining creates no preparation tasks. New members vote from the following session."
 ffpa_sc_leave_decision: "Leave the Survivors Compact"
 ffpa_sc_leave_decision_desc: "Leave the organization and its protocols, ending their benefits and extra costs. No infamy or reversal of laws/buildings. Original preparation deadlines and project cooldowns remain in force."
 ffpa_sc_volunteer_decision: "Volunteer for Coordination"
 ffpa_sc_volunteer_decision_desc: "Volunteer for up to three seats selected by member prestige. Gain proposal rights; influence cost becomes −15%, replacing ordinary membership. No additional votes or veto."
 ffpa_sc_resign_decision: "Withdraw from Coordination"
 ffpa_sc_resign_decision_desc: "Withdraw your candidacy and any current seat, retaining ordinary membership."
 ztr_onu_member: "Compact Member"
 ztr_onu_permanent_member: "Compact Coordinator"
 ffpa_sc_education_modifier: "Education and Technical Exchange"
 ffpa_sc_trade_modifier: "Trade and Customs Cooperation"
 ffpa_sc_works_modifier: "Three-Year Public Works"
 ffpa_sc_education_modifier_desc: "+25% technology spread, +5 percentage points education access, +25% qualifications; +25% schools institution bureaucracy cost and +10% government wages. Education access is not instant literacy."
 ffpa_sc_trade_modifier_desc: "+25% import/export advantage and +20% trade capacity; −10 percentage points maximum import/export tariffs and −5% bureaucracy output. Effects apply to foreign trade generally, not only member trade."
 ffpa_sc_works_modifier_desc: "For three years: +20% state construction efficiency, +25% devastation recovery; +10% construction goods cost and −5% bureaucracy output. Does not clear radiation. Five years between starts."
 ztr_onu_member_desc: "Diplomatic commitments sustain shared knowledge while cooperation is operational."
 ztr_onu_permanent_member_desc: "Additional diplomatic commitments grant proposal rights; each country still has one vote."
 ffpa_sc_propose_education: "Propose: Open Education Protocol"
 ffpa_sc_propose_education_desc: "Submit for the next monthly agenda: three full voting months, followed by nine months of cooldown. Passage opens an option; countries do not join automatically."
 ffpa_sc_propose_trade: "Propose: Open Trade Protocol"
 ffpa_sc_propose_trade_desc: "Submit for the next monthly agenda: three full voting months, followed by nine months of cooldown. Passage opens an option; countries do not join automatically."
 ffpa_sc_propose_works: "Propose: Open Works Cooperation"
 ffpa_sc_propose_works_desc: "Submit for the next monthly agenda: three full voting months, followed by nine months of cooldown. Passage opens an option; countries do not join automatically."
 ffpa_sc_vote_support: "Vote For"
 ffpa_sc_vote_support_desc: "One vote per country, changeable during the session. Passage requires more votes for than against, support from at least one third of eligible members and at least two countries. Abstention is not opposition. No veto."
 ffpa_sc_vote_against: "Vote Against"
 ffpa_sc_vote_against_desc: "One vote per country, changeable during the session. Passage requires more votes for than against, support from at least one third of eligible members and at least two countries. Abstention is not opposition. No veto."
 ffpa_sc_vote_abstain: "Abstain"
 ffpa_sc_vote_abstain_desc: "One vote per country, changeable during the session. Passage requires more votes for than against, support from at least one third of eligible members and at least two countries. Abstention is not opposition. No veto."
 ffpa_sc_join_education: "Opt In: Education Cooperation"
 ffpa_sc_join_education_desc: "+25% technology spread, +5 percentage points education access, +25% qualifications; +25% schools institution bureaucracy cost and +10% government wages. Education access is not instant literacy. Eligible countries participate immediately. Otherwise begin up to five years of preparation using the single active-task slot. No protocol benefits or extra costs during preparation; retry three years after failure."
 ffpa_sc_leave_education: "Leave Education Cooperation"
 ffpa_sc_leave_education_desc: "End this protocol’s benefits and extra costs, retaining domestic institutions and membership. Unfinished preparation deadlines are not reset."
 ffpa_sc_join_trade: "Opt In: Trade Cooperation"
 ffpa_sc_join_trade_desc: "+25% import/export advantage and +20% trade capacity; −10 percentage points maximum import/export tariffs and −5% bureaucracy output. Effects apply to foreign trade generally, not only member trade. Eligible countries participate immediately. Otherwise begin up to five years of preparation using the single active-task slot. No protocol benefits or extra costs during preparation; retry three years after failure."
 ffpa_sc_leave_trade: "Leave Trade Cooperation"
 ffpa_sc_leave_trade_desc: "End this protocol’s benefits and extra costs, retaining domestic institutions and membership. Unfinished preparation deadlines are not reset."
 ffpa_sc_start_works: "Start Three-Year Public Works"
 ffpa_sc_start_works_desc: "For three years: +20% state construction efficiency, +25% devastation recovery; +10% construction goods cost and −5% bureaucracy output. Does not clear radiation. Five years between starts. Requires construction in progress and uses the single active-task slot."
 ffpa_sc_reform: "Advance Compliance Reform"
 ffpa_sc_reform_desc: "When no other law is being enacted, start normal enactment of an available missing law with over 10% enactment chance. No forced passage or cancellation of other laws. Six months between attempts. School institutions still require normal investment."
 ffpa_sc_stop_task: "Abandon Current Task"
 ffpa_sc_stop_task_desc: "Release the active slot and stop associated effects. No fine or refund. Original preparation deadlines, retry restrictions and project cooldowns remain in force."
 ffpa_sc_overview: "Survivors Compact"
 ffpa_sc_overview_reason: "Protocols are opt-in. Unselected protocols create no timed tasks.\nEducation: [GetPlayer.GetCustom('ffpa_sc_education_status')]\nTrade: [GetPlayer.GetCustom('ffpa_sc_trade_status')]\nWorks: [GetPlayer.GetCustom('ffpa_sc_works_status')]\nSkills Training：[GetPlayer.GetCustom('ffpa_sc_aid_talent_status')]\nProduction Research：[GetPlayer.GetCustom('ffpa_sc_aid_production_status')]\nSociety Research：[GetPlayer.GetCustom('ffpa_sc_aid_society_status')]\nMilitary Research：[GetPlayer.GetCustom('ffpa_sc_aid_military_status')]\nOur weekly aid service revenue: £[GetPlayer.MakeScope.ScriptValue('ffpa_sc_aid_my_income')|2]"
 ffpa_sc_overview_goal: "Open cooperation through the assembly, then opt in according to domestic circumstances."
 ffpa_sc_status_dormant: "Awaiting at least two actual members; cooperation benefits and maintenance costs are suspended."
 ffpa_sc_status_pending: "Proposal submitted; voting opens at the next monthly agenda."
 ffpa_sc_status_cooldown: "Assembly recess: [GetGlobalVariable('ffpa_sc_cooldown').GetValue|0] months remaining. Open protocols remain available."
 ffpa_sc_status_ready: "The assembly can receive coordinator proposals."
 ffpa_sc_status_voting: "[GetGlobalVariable('ffpa_sc_months_left').GetValue|0] months remaining. Subject: [GetPlayer.GetCustom('ffpa_sc_vote_subject')]\nFor [GetGlobalVariable('ffpa_sc_support').GetValue|0] / Against [GetGlobalVariable('ffpa_sc_against').GetValue|0]; eligible members [GetGlobalVariable('ffpa_sc_electorate').GetValue|0].\nOur position: [GetPlayer.GetCustom('ffpa_sc_my_vote')]"
 ffpa_sc_task_journal: "Compact: Active Task"
 ffpa_sc_task_journal_reason: "Preparation, works and aid registration share one active slot. Aid registration is free; execution lasts three years and shares the five-year start interval with works. Withdrawal does not reset deadlines or cooldowns."
 ffpa_sc_task_journal_goal: "Complete preparation through normal domestic actions, or maintain the current works or aid project. Its costs and effects start and stop together."
 ffpa_sc_task_works: "About [GetPlayer.MakeScope.Var('ffpa_sc_works_months_left').GetValue|0] months remain (monthly display). For three years: +20% state construction efficiency, +25% devastation recovery; +10% construction goods cost and −5% bureaucracy output. Does not clear radiation. Five years between starts."
 ffpa_sc_task_enacting: "Normal law enactment in progress; awaiting domestic politics."
 ffpa_sc_task_budget: "Administrative headroom is low; AI postpones further commitments."
 ffpa_sc_task_children: "About [GetPlayer.MakeScope.Var('ffpa_sc_education_months_left').GetValue|0] months remain (monthly display). Education preparation: restrict child labor or better. Use the reform button or choose a law normally."
 ffpa_sc_task_schools: "About [GetPlayer.MakeScope.Var('ffpa_sc_education_months_left').GetValue|0] months remain (monthly display). Education preparation: maintain at least level-one schools. Different school systems are accepted; invest through normal institutions."
 ffpa_sc_task_trade: "About [GetPlayer.MakeScope.Var('ffpa_sc_trade_months_left').GetValue|0] months remain (monthly display). Trade preparation: domestic laws must allow foreign trade; free trade is not mandatory."
