 ffpa_sc_task_schools_details: "#header Requirements#!\nRestricted child labor or stronger: [GetPlayer.GetCustom('ffpa_sc_child_requirement')]\nSchool institution at level one or higher: [GetPlayer.GetCustom('ffpa_sc_school_requirement')]\n\n#header Next Step#!\n[GetPlayer.GetCustom('ffpa_sc_preparation_hint')]\nMeet the requirements through normal enactment and institution investment.\n\n#lore Preparation grants no protocol benefits or extra costs. On failure, retry three years after the original deadline.#!"
 ffpa_sc_task_trade_details: "#header Requirements#!\nLaws permit foreign trade: [GetPlayer.GetCustom('ffpa_sc_trade_requirement')]\n\n#header Next Step#!\n[GetPlayer.GetCustom('ffpa_sc_preparation_hint')]\nRemove the foreign-trade prohibition through normal enactment.\n\n#lore Preparation grants no protocol benefits or extra costs. On failure, retry three years after the original deadline.#!"
