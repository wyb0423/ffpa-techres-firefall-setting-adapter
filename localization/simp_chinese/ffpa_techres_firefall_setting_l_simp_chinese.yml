l_simp_chinese:
 international_organizations:0 "幸存者协定体系"
 international_organizations_desc:0 "分散的幸存飞地与继承政权，已无法依靠旧世界的机构解决争端。常驻代表与协商缔结的协定，为相互承认、调停和共同行动建立了共同语言。合作扩大了各方的外交影响，共同规则也使扩张行为更难获得邻国的认可。"
 decolonization:0 "继承政权承认"
 decolonization_desc:0 "一面旧国旗，已不足以证明对其下居民的统治权。城市议会、聚落大会与继承政权提出彼此竞争的主权诉求。承认这些诉求的制度赋予新政权国际地位，也使争取自治的居民在面对帝国复辟者时获得更有力的依据。"
 neoimperialism:0 "重建霸权"
 neoimperialism_desc:0 "能够提供保护、援助和行政经验的国家，逐渐对仍在挣扎求存的邻邦取得支配力。共同治安安排降低了维持秩序的成本，驻军与依附政权则延伸了庇护者的影响。然而，每一次权力伸张，也加深了人们对重建正在成为帝国新名号的疑虑。"
 penicillin:0 "青霉素"
 penicillin_desc:0 "恢复稳定的青霉素供应，使创伤与感染重新得到有效治疗。产科诊所能够防治分娩前后的感染；随着基本医疗重返聚落，幸存家庭也更有信心养育下一代。"
 socialdemocracy:0 "社会民主主义"
 socialdemocracy_desc:0 "重建依靠人，也依靠机器。公共托育、家庭支持与共同承担的公共服务，使父母能够兼顾养育与有偿劳动。社会保障让幸存家庭分享新秩序的成果，也让恢复文明成为更多人能够参与的共同事业。"
 vaccination_campaigns:0 "疫苗接种运动"
 vaccination_campaigns_desc:0 "流离失所与常规医疗的崩溃，使整个社区暴露于本可预防的疾病之下。恢复疫苗供应、组织流动诊所并培养基层卫生人员，能够重新建立群体防护，减少死亡及疫病对聚落生活的冲击。"
 genetic_disease_screening:0 "遗传病筛检"
 genetic_disease_screening_desc:0 "在病历散失、专科医疗匮乏的废土上，自愿筛检、保密咨询与早期治疗帮助家庭应对遗传疾病。更可靠的孕产支持使生育更加安全，医疗服务不以血统或筛检结果作为准入条件。"
 neo_feminism:0 "新女权主义"
 neo_feminism_desc:0 "人口稀缺的社会难以承受将女性排除在公共生活与就业之外的壁垒。平等的培训和就业机会、共同育儿与可靠的托育服务，使更多成年人能够参与重建，也为选择生育的家庭提供支持。"
 genetic_engineering:0 "基因工程"
 genetic_engineering_desc:0 "重建的实验室重新掌握治疗遗传疾病与恢复生殖健康的技术。自愿治疗与临床监督，将旧世界的一部分知识转化为更长久、更健康的生命，也为重建生活的家庭带来新的可能。"
 transnational_activism:0 "跨境互助网络"
 transnational_activism_desc:0 "大火抹去了许多国界，却没有消除跨地域合作的需要。无线电中继、商队信使与逐步恢复的数据链路，使工会、学者和地方团体能够在分散的聚落之间交换警报、协调救援，并共同约束重新崛起的强权。"
 global_stock_market:0 "跨区结算网络"
 global_stock_market_desc:0 "旧证券交易所及其即时全球市场已经消失。统一账册、可信清算所、无线电报价与受护送的信使路线重新连接起幸存市场，使资本得以再次跨越地区边界。"
 globalization:0 "战后再联通"
 globalization_desc:0 "这并非旧世界无缝全球经济的回归。重新开放的港口、修复的铁路走廊、共同商业标准和长途通信中继，正把彼此孤立的市场逐步连接成一套脆弱的新交换体系。"
 social_media:0 "网状公共空间"
 social_media_desc:0 "旧世界的集中式平台未能完整幸存。地方服务器、无线电互联的信息板和临时搭建的网状网络，使遥远社区得以重新对话；它们扩大了社会影响，也削弱了政府对信息的垄断。"
 app_economy:0 "分布式服务平台"
 app_economy_desc:0 "恢复的软件栈与重建的支付链路，使商户、办公机构和货运经营者能够通过分布式服务平台协同运作。其中最成功的经营者逐渐成长为适应不稳定基础设施的新一代公司。"
