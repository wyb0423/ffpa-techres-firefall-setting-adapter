l_simp_chinese:
 transnational_activism:0 "跨境互助网络"
 transnational_activism_desc:0 "大火抹去了许多国界，却没有消除跨地域合作的需要。无线电中继、商队信使与逐步恢复的数据链路，使工会、学者和地方团体能够在分散的聚落之间交换警报、协调救援，并共同约束重新崛起的强权。"
 global_stock_market:0 "跨区结算网络"
 global_stock_market_desc:0 "旧证券交易所及其即时全球市场已经消失。统一账册、可信清算所、无线电报价与受护送的信使路线重新连接起幸存市场，使资本得以再次跨越地区边界。"
 globalization:0 "战后再联通"
 globalization_desc:0 "这并非旧世界无缝全球经济的回归。重新开放的港口、修复的铁路走廊、共同商业标准和长途通信中继，正把彼此孤立的市场逐步连接成一套脆弱的新交换体系。"
 social_media:0 "网状公共空间"
 social_media_desc:0 "旧世界的集中式平台未能完整幸存。地方服务器、无线电互联的信息板和临时搭建的网状网络，使遥远社区得以重新对话；它们扩大了社会影响，也削弱了政府对信息的垄断。"
 app_economy:0 "分布式服务平台"
 app_economy_desc:0 "恢复的软件栈与重建的支付链路，使商户、办公机构和货运经营者能够通过分布式服务平台协同运作。其中最成功的经营者逐渐成长为适应不稳定基础设施的新一代公司。"
