 ffpa_sc_decline: "暂不参加"
 ffpa_sc_ack: "知悉"
 ffpa_sc.1.t: "幸存者之间的联系"
 ffpa_sc.1.d: "#header 合作邀请#!\n加入后建立常态知识联系，各项专项合作仍由本国自选。\n\n#header 会员成长#!\n有效合作不足2年／满2年／满6年：\n科技扩散 #P +5%／+10%／+15%#!\n创新力产出 #P +2%／+4%／+6%#!\n影响力 #N −5%／−10%／−10%#!\n\n#header 生效条件#!\n至少两个合格会员时生效并累计。不提高创新力上限，入会不改法、不自动参加专项协议。"
 ffpa_sc.2.t: "协定议会开议"
 ffpa_sc.2.d: "开议通知\n新议案进入完整 3 个月表决。\n\n本国行动\n打开 幸存者协定总览，查看实时议题与票数，选择赞成、反对或弃权。\n\n支持开放合作，不等于本国已经参加。"
 ffpa_sc.3.t: "协定表决结束"
 ffpa_sc.3.d: "表决结算\n结果：[GetPlayer.GetCustom('ffpa_sc_vote_result')]\n议会进入 9 个月休会。\n\n后续安排\n援助议案通过且有供给时，开放 1 个月报名，计入本次休会。其他协议通过后开放自选参加。\n\n请在总览查看实际开放状态；通过议案不会自动替本国创建任务。"
 ffpa_sc.4.t: "履约准备期结束"
 ffpa_sc.4.d: "#header 准备未完成#!\n#N 已超过原定期限#!，本项专项承诺结束。\n\n#header 再次尝试#!\n从原截止时间起等待 #V 3 年#!后可重试。\n\n#header 保留成果#!\n国内法律和制度保持现状，不增加恶名。"
 ffpa_sc.5.t: "幸存者协定：旧档适配"
 ffpa_sc.5.d: "#header 组织适配完成#!\n合格旧会员保留普通身份，旧机构映射为可选合作；旧议案与旧机构效果已清理。\n\n#header 需要重新选择#!\n请在协定总览自行参加协议，并按意愿承担协调职责。\n\n#header 保留现状#!\n已改变的国内法律、领土、建筑与核条约不回滚。"
 ffpa_sc_result_pass: "通过"
 ffpa_sc_result_fail: "未通过"
 ffpa_sc.1.f: "联络员带来了一份重建合作倡议：成员可以交换知识、改善贸易条件，并参与公共工程。加入只代表建立联系；各项协议仍由本国自行决定是否参加。"
 ffpa_sc.2.f: "代表们开始讨论是否向成员开放新的合作渠道。支持一项议案，并不意味着本国必须承担该项目的义务。"
 ffpa_sc.3.f: "代表们已完成本轮表态。各国可以在协定总览中查看开放的合作，自行衡量收益与代价。"
 ffpa_sc.4.f: "原定准备期限已经结束。协定不代替本国制定法律；待重试期限结束后，我们仍可重新作出承诺。"
 ffpa_sc.5.f: "原有组织已转为自愿重建合作。会员需要重新选择希望参加的项目，国内已经形成的制度与投资继续保留。"
