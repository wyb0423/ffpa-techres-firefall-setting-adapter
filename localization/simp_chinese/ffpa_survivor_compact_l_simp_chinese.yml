 ffpa_sc_aid_reduce_current_desc: "#header 调整效果#!\n本轮服务费用与收益 #b 同时减半#!。\n\n#header 使用限制#!\n执行满一年后的年度复核可选，本轮只能决定一次。\n原截止时间与启动冷却不变。"
