l_simp_chinese:
 ffpa_sc_found_decision: "发起幸存者协定"
 ffpa_sc_found_decision_desc: "建立合作报名入口，自愿承担协调职责。至少两国实际加入后启用合作和议会，不自动改变任何国家的法律。"
 ffpa_sc_join_decision: "加入幸存者协定"
 ffpa_sc_join_decision_desc: "加入后按有效合作月份逐步成长：不足2年、满2年、满6年时，科技扩散分别 +5%／+10%／+15%，创新力产出 +2%／+4%／+6%，影响力 −5%／−10%／−10%。不提高创新力上限。至少两国合作时生效并累计，各项协议自选，当前表决从下一轮参与。"
 ffpa_sc_leave_decision: "退出幸存者协定"
 ffpa_sc_leave_decision_desc: "退出组织及专项合作，停止相关收益和额外成本。不增加恶名，不撤销法律或建筑。会员合作进度清空，重新加入从第一阶段开始；原准备期限和工程冷却继续有效。"
 ffpa_sc_volunteer_decision: "申请承担协调职责"
 ffpa_sc_volunteer_decision_desc: "自愿竞逐最多三个协调席位，按会员威望选拔并取得提案权。额外承担影响力 −5%，科研收益及合作进度与普通会员相同。没有额外票重或否决权。"
 ffpa_sc_resign_decision: "辞去协调职责"
 ffpa_sc_resign_decision_desc: "退出协调候选并放弃现有席位，继续作为普通会员参加合作。"
 ztr_onu_member: "协定普通会员"
 ztr_onu_permanent_member: "协定主要协调国"
 ffpa_sc_education_modifier: "教育与技术交流"
 ffpa_sc_trade_modifier: "商路与通关合作"
 ffpa_sc_works_modifier: "三年公共工程计划"
 ffpa_sc_education_modifier_desc: "科技扩散 +25%，受教育机会 +5 个百分点，资质 +25%；学校制度官僚成本 +25%，政府工资 +10%。受教育机会不等于即时识字率。"
 ffpa_sc_trade_modifier_desc: "进口、出口贸易优势各 +25%，贸易容量 +20%；最大进口、出口关税各 −10 个百分点，官僚产出 −5%。效果改善本国对外贸易，不仅限于会员交易。"
 ffpa_sc_works_modifier_desc: "持续三年：地区建造力效率 +20%，荒废度恢复 +25%；建造商品花费 +10%，官僚产出 −5%。不清除辐射。两次启动至少间隔五年。"
 ztr_onu_member_desc: "合作运行时以外交投入换取知识联系。"
 ztr_onu_permanent_member_desc: "承担更多外交投入并取得提案资格，每国仍然只有一票。"
 ffpa_sc_propose_education: "提案：开放教育协议"
 ffpa_sc_propose_education_desc: "提交后在下个月度议程开议，完整表决三个月，随后冷却九个月。通过只开放选项，不替各国参加。"
 ffpa_sc_propose_trade: "提案：开放贸易协议"
 ffpa_sc_propose_trade_desc: "提交后在下个月度议程开议，完整表决三个月，随后冷却九个月。通过只开放选项，不替各国参加。"
 ffpa_sc_propose_works: "提案：开放工程合作"
 ffpa_sc_propose_works_desc: "提交后在下个月度议程开议，完整表决三个月，随后冷却九个月。通过只开放选项，不替各国参加。"
 ffpa_sc_vote_support: "投赞成票"
 ffpa_sc_vote_support_desc: "每国一票，可在表决期间改票。通过需赞成多于反对，且赞成至少为合资格会员三分之一、至少两国。弃权不等于反对，没有否决权。"
 ffpa_sc_vote_against: "投反对票"
 ffpa_sc_vote_against_desc: "每国一票，可在表决期间改票。通过需赞成多于反对，且赞成至少为合资格会员三分之一、至少两国。弃权不等于反对，没有否决权。"
 ffpa_sc_vote_abstain: "弃权"
 ffpa_sc_vote_abstain_desc: "每国一票，可在表决期间改票。通过需赞成多于反对，且赞成至少为合资格会员三分之一、至少两国。弃权不等于反对，没有否决权。"
 ffpa_sc_join_education: "自选参加教育合作"
 ffpa_sc_join_education_desc: "科技扩散 +25%，受教育机会 +5 个百分点，资质 +25%；学校制度官僚成本 +25%，政府工资 +10%。受教育机会不等于即时识字率。 已达标者直接参加；未达标者开启最长五年准备期，占用唯一活动任务名额。准备期没有专项收益或额外费用；失败后三年可重试。"
 ffpa_sc_leave_education: "退出教育合作"
 ffpa_sc_leave_education_desc: "停止该项收益与额外成本，保留本国制度和会员身份。不会重置尚未结束的准备期限。"
 ffpa_sc_join_trade: "自选参加贸易合作"
 ffpa_sc_join_trade_desc: "进口、出口贸易优势各 +25%，贸易容量 +20%；最大进口、出口关税各 −10 个百分点，官僚产出 −5%。效果改善本国对外贸易，不仅限于会员交易。 已达标者直接参加；未达标者开启最长五年准备期，占用唯一活动任务名额。准备期没有专项收益或额外费用；失败后三年可重试。"
 ffpa_sc_leave_trade: "退出贸易合作"
 ffpa_sc_leave_trade_desc: "停止该项收益与额外成本，保留本国制度和会员身份。不会重置尚未结束的准备期限。"
 ffpa_sc_start_works: "启动三年工程计划"
 ffpa_sc_start_works_desc: "持续三年：地区建造力效率 +20%，荒废度恢复 +25%；建造商品花费 +10%，官僚产出 −5%。不清除辐射。两次启动至少间隔五年。 需有正在施工的建筑，占用唯一活动任务名额。"
 ffpa_sc_reform: "推进履约改革"
 ffpa_sc_reform_desc: "在没有其他立法时，选择一项可立法且通过机会超过 10% 的缺失法律，启动正常立法。不会强制通过或抢占已有立法。两次尝试至少间隔六个月。学校制度仍需正常投资。"
 ffpa_sc_stop_task: "中止当前任务"
 ffpa_sc_stop_task_desc: "释放活动名额并停止相关效果，不罚款、不退款。原准备期限、失败重试限制和工程冷却继续有效。"
 ffpa_sc_overview: "幸存者协定"
 ffpa_sc_overview_reason: "各项合作自选参加。未选择的协议没有限期任务。\n教育：[GetPlayer.GetCustom('ffpa_sc_education_status')]\n贸易：[GetPlayer.GetCustom('ffpa_sc_trade_status')]\n工程：[GetPlayer.GetCustom('ffpa_sc_works_status')]\n教育普及：[GetPlayer.GetCustom('ffpa_sc_aid_education_status')]\n人才培养：[GetPlayer.GetCustom('ffpa_sc_aid_talent_status')]\n生产技术合作：[GetPlayer.GetCustom('ffpa_sc_aid_production_status')]\n社会技术合作：[GetPlayer.GetCustom('ffpa_sc_aid_society_status')]\n军事技术合作：[GetPlayer.GetCustom('ffpa_sc_aid_military_status')]\n我国援助服务周收入：£[GetPlayer.MakeScope.ScriptValue('ffpa_sc_aid_my_income')|2]"
 ffpa_sc_overview_goal: "通过议会开放合作，再按国情自选参加。"
 ffpa_sc_status_dormant: "等待至少两个实际会员；合作收益与维护成本暂停。"
 ffpa_sc_status_pending: "议案已提交，下个月度议程开议。"
 ffpa_sc_status_cooldown: "议会休会：还剩 [GetGlobalVariable('ffpa_sc_cooldown').GetValue|0] 个月。已开放协议可继续参加。"
 ffpa_sc_status_ready: "议会可以接收协调国提案。"
 ffpa_sc_status_voting: "表决剩余 [GetGlobalVariable('ffpa_sc_months_left').GetValue|0] 个月。议题：[GetPlayer.GetCustom('ffpa_sc_vote_subject')]\n赞成 [GetGlobalVariable('ffpa_sc_support').GetValue|0]／反对 [GetGlobalVariable('ffpa_sc_against').GetValue|0]；合资格会员 [GetGlobalVariable('ffpa_sc_electorate').GetValue|0]。\n本国立场：[GetPlayer.GetCustom('ffpa_sc_my_vote')]"
 ffpa_sc_task_journal: "协定：当前活动任务"
 ffpa_sc_task_journal_reason: "准备期、工程和援助报名共用一个活动名额。援助报名不收费；实际启动后三年执行，与工程共用五年启动间隔。中止不重置期限或冷却。"
 ffpa_sc_task_journal_goal: "通过正常国内行动完成准备，或维持当前工程／援助计划。费用与效果同步启停。"
 ffpa_sc_task_works: "约剩余 [GetPlayer.MakeScope.Var('ffpa_sc_works_months_left').GetValue|0] 个月（按月显示）。持续三年：地区建造力效率 +20%，荒废度恢复 +25%；建造商品花费 +10%，官僚产出 −5%。不清除辐射。两次启动至少间隔五年。"
 ffpa_sc_task_enacting: "正在正常立法；等待本国政治进程。"
 ffpa_sc_task_budget: "行政余量不足，AI 暂缓进一步投入。"
 ffpa_sc_task_children: "约剩余 [GetPlayer.MakeScope.Var('ffpa_sc_education_months_left').GetValue|0] 个月（按月显示）。教育准备：至少限制童工。可使用推进改革按钮，或自行选择法律。"
 ffpa_sc_task_schools: "约剩余 [GetPlayer.MakeScope.Var('ffpa_sc_education_months_left').GetValue|0] 个月（按月显示）。教育准备：维持至少一级学校制度。允许不同教育制度，投资由本国正常进行。"
 ffpa_sc_task_trade: "约剩余 [GetPlayer.MakeScope.Var('ffpa_sc_trade_months_left').GetValue|0] 个月（按月显示）。贸易准备：国内法律需要允许对外贸易，不要求自由贸易。"
 ffpa_sc_label_closed: "尚未开放"
 ffpa_sc_label_available: "可自选参加"
 ffpa_sc_label_active: "已参加并生效"
 ffpa_sc_label_paused: "已参加，效果暂停"
 ffpa_sc_label_preparing: "正在准备"
 ffpa_sc_label_retry: "处于重试冷却"
 ffpa_sc_label_education: "教育与技术交流"
 ffpa_sc_label_trade: "商路与通关合作"
 ffpa_sc_label_works: "公共工程合作"
