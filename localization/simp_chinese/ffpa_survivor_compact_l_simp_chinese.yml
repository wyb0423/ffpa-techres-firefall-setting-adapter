 ffpa_sc_label_no: "反对"
 ffpa_sc_label_neutral: "弃权／尚未表态"
 ffpa_sc_label_ineligible: "本轮无投票资格"
 ffpa_sc_accept: "加入协定"
 ffpa_sc_decline: "暂不参加"
 ffpa_sc_ack: "知悉"
 ffpa_sc.1.t: "幸存者之间的联系"
 ffpa_sc.1.d: "幸存者协定开放报名。通过持续联络与知识交流，会员科技扩散从 +5% 逐步成长至 +15%，创新力产出从 +2% 成长至 +6%；满2年及6年升级，影响力成本从 −5% 增至 −10%。至少两国合作时生效并累计，入会不改法、不自动参加专项协议。"
 ffpa_sc.2.t: "协定议会开议"
 ffpa_sc.2.d: "新议案开始完整三个月表决。请在“幸存者协定”总览查看议题和票数，选择赞成、反对或弃权。"
 ffpa_sc.3.t: "协定表决结束"
 ffpa_sc.3.d: "表决结果：[GetPlayer.GetCustom('ffpa_sc_vote_result')]。议会进入九个月冷却。援助计划通过后开放一个月报名；其他协议开放自选参加，不自动创建任务。"
 ffpa_sc.4.t: "履约准备期结束"
 ffpa_sc.4.d: "本次准备未能按期完成，专项承诺已结束。三年重试期限从原截止时间起算；国内法律和制度保持现状，不增加恶名。"
 ffpa_sc.5.t: "幸存者协定：旧档适配"
 ffpa_sc.5.d: "旧联合国机制已迁移。合格会员保留普通身份，旧机构映射为可选合作；旧议案和旧机构效果已清理。请自行选择协议及协调职责。已改变的国内法律、领土、建筑和核条约不会被回滚。"
 ffpa_sc_result_pass: "通过"
 ffpa_sc_result_fail: "未通过"
 ffpa_sc.1.f: "联络员带来了一份重建合作倡议：成员可以交换知识、改善贸易条件，并参与公共工程。加入只代表建立联系；各项协议仍由本国自行决定是否参加。"
 ffpa_sc.2.f: "代表们开始讨论是否向成员开放新的合作渠道。支持一项议案，并不意味着本国必须承担该项目的义务。"
 ffpa_sc.3.f: "代表们已完成本轮表态。各国可以在协定总览中查看开放的合作，自行衡量收益与代价。"
 ffpa_sc.4.f: "原定准备期限已经结束。协定不代替本国制定法律；待重试期限结束后，我们仍可重新作出承诺。"
 ffpa_sc.5.f: "原有组织已转为自愿重建合作。会员需要重新选择希望参加的项目，国内已经形成的制度与投资继续保留。"
