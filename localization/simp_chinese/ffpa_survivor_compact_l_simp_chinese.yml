l_simp_chinese:
 ffpa_sc_found_decision: "发起幸存者协定"
 ffpa_sc_found_decision_desc: "建立合作报名入口，自愿承担协调职责。至少两国实际加入后启用合作和议会，不自动改变任何国家的法律。"
 ffpa_sc_join_decision: "加入幸存者协定"
 ffpa_sc_join_decision_desc: "加入后按有效合作月份逐步成长：不足2年、满2年、满6年时，科技扩散分别 +5%／+10%／+15%，创新力产出 +2%／+4%／+6%，影响力 −5%／−10%／−10%。不提高创新力上限。至少两国合作时生效并累计，各项协议自选，当前表决从下一轮参与。"
 ffpa_sc_leave_decision: "退出幸存者协定"
 ffpa_sc_leave_decision_desc: "退出组织及专项合作，停止相关收益和额外成本。不增加恶名，不撤销法律或建筑。会员合作进度清空，重新加入从第一阶段开始；原准备期限和工程冷却继续有效。"
 ffpa_sc_volunteer_decision: "申请承担协调职责"
 ffpa_sc_volunteer_decision_desc: "自愿竞逐最多三个协调席位，按会员威望选拔并取得提案权。额外承担影响力 −5%，科研收益及合作进度与普通会员相同。没有额外票重或否决权。"
 ffpa_sc_resign_decision: "辞去协调职责"
 ffpa_sc_resign_decision_desc: "退出协调候选并放弃现有席位，继续作为普通会员参加合作。"
 ztr_onu_member: "协定普通会员"
 ztr_onu_permanent_member: "协定主要协调国"
 ffpa_sc_education_modifier: "教育与技术交流"
 ffpa_sc_trade_modifier: "商路与通关合作"
 ffpa_sc_works_modifier: "三年公共工程计划"
 ffpa_sc_education_modifier_desc: "#header 合作收益#!\n科技扩散 #P +25%#!\n受教育机会 #P +5 个百分点#!\n人口资质 #P +25%#!\n\n#header 维护成本#!\n学校制度官僚成本 #N +25%#!\n政府工资 #N +10%#!\n\n#lore 受教育机会不等于即时提高识字率。#!"
 ffpa_sc_trade_modifier_desc: "#header 合作收益#!\n进口、出口贸易优势各 #P +25%#!\n贸易容量 #P +20%#!\n\n#header 维护成本#!\n最大进口、出口关税各 #N −10 个百分点#!\n官僚产出 #N −5%#!\n\n#lore 效果适用于本国对外贸易，不仅限于会员之间。#!"
 ffpa_sc_works_modifier_desc: "#header 建设收益#!\n地区建造力效率 #P +20%#!\n荒废度恢复 #P +25%#!\n\n#header 维护成本#!\n建造商品花费 #N +10%#!\n官僚产出 #N −5%#!\n\n#header 期限与限制#!\n持续 #V 3 年#!；与援助共用 #V 5 年#!启动间隔。\n#b 不清除辐射#!。"
 ztr_onu_member_desc: "合作运行时以外交投入换取知识联系。"
 ztr_onu_permanent_member_desc: "承担更多外交投入并取得提案资格，每国仍然只有一票。"
 ffpa_sc_propose_education: "提案：开放教育协议"
 ffpa_sc_propose_education_desc: "#header 议会程序#!\n下个月度议程开议，表决 #V 3 个月#!，结算后休会 #V 9 个月#!。\n\n#header 通过后#!\n开放该项合作，由各国 #b 自选参加#!；不自动创建履约任务。"
 ffpa_sc_propose_trade: "提案：开放贸易协议"
 ffpa_sc_propose_trade_desc: "#header 议会程序#!\n下个月度议程开议，表决 #V 3 个月#!，结算后休会 #V 9 个月#!。\n\n#header 通过后#!\n开放该项合作，由各国 #b 自选参加#!；不自动创建履约任务。"
 ffpa_sc_propose_works: "提案：开放工程合作"
 ffpa_sc_propose_works_desc: "#header 议会程序#!\n下个月度议程开议，表决 #V 3 个月#!，结算后休会 #V 9 个月#!。\n\n#header 通过后#!\n开放该项合作，由各国 #b 自选参加#!；不自动创建履约任务。"
 ffpa_sc_vote_support: "投赞成票"
 ffpa_sc_vote_support_desc: "#header 表决规则#!\n每国 #V 1 票#!，表决期间可改票。\n\n#header 通过门槛#!\n赞成票多于反对票。\n赞成票至少达到合资格会员的 #V 三分之一#!，且至少 #V 2 国#!。\n\n#lore 弃权不计为反对；协调国没有额外票重或否决权。#!"
 ffpa_sc_vote_against: "投反对票"
 ffpa_sc_vote_against_desc: "#header 表决规则#!\n每国 #V 1 票#!，表决期间可改票。\n\n#header 通过门槛#!\n赞成票多于反对票。\n赞成票至少达到合资格会员的 #V 三分之一#!，且至少 #V 2 国#!。\n\n#lore 弃权不计为反对；协调国没有额外票重或否决权。#!"
 ffpa_sc_vote_abstain: "弃权"
 ffpa_sc_vote_abstain_desc: "#header 表决规则#!\n每国 #V 1 票#!，表决期间可改票。\n\n#header 通过门槛#!\n赞成票多于反对票。\n赞成票至少达到合资格会员的 #V 三分之一#!，且至少 #V 2 国#!。\n\n#lore 弃权不计为反对；协调国没有额外票重或否决权。#!"
 ffpa_sc_join_education: "自选参加教育合作"
 ffpa_sc_join_education_desc: "$ffpa_sc_education_modifier_desc$\n\n#header 参加方式#!\n已达标即生效；否则开始最长 #V 5 年#!准备，占用唯一活动名额。\n准备期无专项收益或额外费用。失败后，从原截止时间起等待 #V 3 年#!才能重试。"
 ffpa_sc_leave_education: "退出教育合作"
 ffpa_sc_leave_education_desc: "#header 退出后#!\n停止本项合作的 #b 收益与额外成本#!，保留会员身份及本国法律、制度。\n\n#header 仍然保留#!\n尚未结束的准备期限与原有重试限制。"
 ffpa_sc_join_trade: "自选参加贸易合作"
 ffpa_sc_join_trade_desc: "$ffpa_sc_trade_modifier_desc$\n\n#header 参加方式#!\n已达标即生效；否则开始最长 #V 5 年#!准备，占用唯一活动名额。\n准备期无专项收益或额外费用。失败后，从原截止时间起等待 #V 3 年#!才能重试。"
 ffpa_sc_leave_trade: "退出贸易合作"
 ffpa_sc_leave_trade_desc: "#header 退出后#!\n停止本项合作的 #b 收益与额外成本#!，保留会员身份及本国法律、制度。\n\n#header 仍然保留#!\n尚未结束的准备期限与原有重试限制。"
 ffpa_sc_start_works: "启动三年工程计划"
 ffpa_sc_start_works_desc: "$ffpa_sc_works_modifier_desc$\n\n#header 启动条件#!\n已有正在施工的建筑；占用唯一活动任务名额。"
 ffpa_sc_reform: "推进履约改革"
 ffpa_sc_reform_desc: "#header 本次行动#!\n从缺失法律中选择可立法且通过机会超过 #V 10%#! 的一项，启动正常立法。\n\n#header 条件与限制#!\n不能已有其他立法；两次尝试至少间隔 #V 6 个月#!。\n#b 不强制通过#!，学校制度仍需正常投资。"
 ffpa_sc_stop_task: "中止当前任务"
 ffpa_sc_stop_task_desc: "#header 中止后#!\n释放活动名额，停止该任务相关效果；不罚款、不退款。\n\n#header 仍然保留#!\n原准备期限、失败重试限制，以及工程／援助的启动冷却。"
 ffpa_sc_overview: "幸存者协定"
 ffpa_sc_overview_reason: "联络员、教师与工程人员把各国的重建经验带到同一张议事桌上。协定开放合作渠道，#b 每项承诺仍由本国自选#!。\n\n#header 长期协议#!\n教育交流：[GetPlayer.GetCustom('ffpa_sc_education_status')]\n贸易合作：[GetPlayer.GetCustom('ffpa_sc_trade_status')]\n\n#header 限期项目#!\n公共工程：[GetPlayer.GetCustom('ffpa_sc_works_status')]\n\n#header 援助计划#!\n教育普及：[GetPlayer.GetCustom('ffpa_sc_aid_education_status')]\n人才培养：[GetPlayer.GetCustom('ffpa_sc_aid_talent_status')]\n生产技术：[GetPlayer.GetCustom('ffpa_sc_aid_production_status')]\n社会技术：[GetPlayer.GetCustom('ffpa_sc_aid_society_status')]\n军事技术：[GetPlayer.GetCustom('ffpa_sc_aid_military_status')]\n\n#header 本国援助收支 · 每周#!\n服务收入：#V £[GetPlayer.MakeScope.ScriptValue('ffpa_sc_aid_my_income')|2]#!\n[GetPlayer.GetCustom('ffpa_sc_aid_payment')]\n\n#lore 协议收益与成本见对应参加按钮；未选择的合作不产生限期任务。#!"
 ffpa_sc_overview_goal: "由议会开放合作，按本国条件选择参加。"
 ffpa_sc_status_dormant: "#header 议会 · 等待会员#!\n至少需要 #V 2#! 个合格的实际会员。\n#yellow 合作收益与维护成本暂停#!。"
 ffpa_sc_status_pending: "#header 议会 · 议案已提交#!\n#b 下个月度议程#!开始三个月表决。"
 ffpa_sc_status_cooldown: "#header 议会 · 休会#!\n剩余 #V [GetGlobalVariable('ffpa_sc_cooldown').GetValue|0]#! 个月。\n已开放的协议仍可自选参加。"
 ffpa_sc_status_ready: "#header 议会 · 可提交提案#!\n协调国可以提出下一项合作议案。"
 ffpa_sc_status_voting: "#header 议会 · 表决中#!\n议题：#b [GetPlayer.GetCustom('ffpa_sc_vote_subject')]#!\n剩余 #V [GetGlobalVariable('ffpa_sc_months_left').GetValue|0]#! 个月\n\n赞成 #V [GetGlobalVariable('ffpa_sc_support').GetValue|0]#!　反对 #V [GetGlobalVariable('ffpa_sc_against').GetValue|0]#!\n合资格会员：#V [GetGlobalVariable('ffpa_sc_electorate').GetValue|0]#!\n本国立场：#b [GetPlayer.GetCustom('ffpa_sc_my_vote')]#!"
 ffpa_sc_task_journal: "协定：当前活动任务"
 ffpa_sc_task_journal_reason: "[GetPlayer.GetCustom('ffpa_sc_task_brief')]\n\n[GetPlayer.GetCustom('ffpa_sc_task_details')]\n\n#lore 准备、工程与援助报名共用一个活动名额；中止不重置原期限或已有冷却。#!"
 ffpa_sc_task_journal_goal: "完成当前准备，或维持工程／援助投入；具体条件与收支见任务详情。"
 ffpa_sc_task_works: "#header 公共工程 · 执行中#!\n剩余约 #V [GetPlayer.MakeScope.Var('ffpa_sc_works_months_left').GetValue|0]#! 个月（按月更新）"
 ffpa_sc_task_enacting: "#yellow 已有立法进行中#!；请等待本国政治进程。"
 ffpa_sc_task_budget: "#yellow 行政余量不足#!，AI 暂缓进一步投入。"
 ffpa_sc_task_children: "$ffpa_sc_task_schools$"
 ffpa_sc_task_schools: "#header 教育合作 · 准备中#!\n剩余约 #V [GetPlayer.MakeScope.Var('ffpa_sc_education_months_left').GetValue|0]#! 个月（按月更新）"
 ffpa_sc_task_trade: "#header 贸易合作 · 准备中#!\n剩余约 #V [GetPlayer.MakeScope.Var('ffpa_sc_trade_months_left').GetValue|0]#! 个月（按月更新）"
