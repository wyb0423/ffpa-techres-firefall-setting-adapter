 ffpa_sc.6.t: "援助计划：年度预算复核"
 ffpa_sc.6.d: "#header 年度预算复核#!\n本轮援助已运行一年，请确认后续投入。\n\n#header 可选安排#!\n#b 维持投入#!：继续当前服务与费用。\n#b 精简投入#!：后续费用与收益同时减半。\n#b 退出本轮#!：停止参加及相关收支。\n\n#header 期限不变#!\n原截止时间与 #V 5 年#!启动间隔继续有效。\n\n[GetPlayer.GetCustom('ffpa_sc_aid_alternative_offer')]\n上述为替代方向的全额基准，随供给比例缩放。费用不变；替代方向、维持或精简只能择一，本轮不能再次切换。"
 ffpa_sc.6.f: "协定的专家团队提交了下一阶段的服务安排，各国需要确认能够继续承担的投入。"
 ffpa_sc_aid_keep: "维持本轮投入"
 ffpa_sc_aid_cancel: "退出本轮计划"
 ffpa_sc_membership_1_modifier: "协定会员：建立联络"
 ffpa_sc_membership_1_modifier_desc: "有效合作时间按月累计，72个月封顶。满24及72个月进入下一阶段；阶段不叠加，不增加创新力上限。组织不足两名会员时暂停计时及奖惩，退会清空进度。"
