 ffpa_sc_aid_education_register_desc: "$ffpa_sc_aid_education_benefits$\n\n#header 费用预估 · 每周#!\n全额报价：#V £[GetPlayer.MakeScope.ScriptValue('ffpa_sc_aid_education_quote')|2]#!\n按当前供给预计：#V £[GetPlayer.MakeScope.ScriptValue('ffpa_sc_aid_education_current_quote')|2]#!\n费用与收益按供给同步缩放至 #V 50%／75%／100%#!；无供给则不能启动。\n\n#header 报名与执行#!\n#b 报名不收费#!，先占用唯一活动名额。\n启动后执行 #V 3 年#!，与工程共用 #V 5 年#!启动间隔。"
